<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جزارة سيد خلف - الإسماعيلية</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{colors:{gold:{accent:'#D4AF37'},burgundy:{950:'#1A0408'},darkbg:'#0D0E12',cardbg:'#161820'}}}}</script>
<style>body{font-family:'Cairo',sans-serif;background:#0A0B0E;color:#fff}.gold-gradient-text{background:linear-gradient(135deg,#FFF2A8,#D4AF37,#A37A1E);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.gold-btn{background:linear-gradient(135deg,#D4AF37,#B8860B);color:#000;font-weight:800}</style>
</head>
<body>
<header class="sticky top-0 z-40 bg-black/95 border-b border-yellow-600/20 p-4"><div class="max-w-7xl mx-auto flex justify-between items-center"><div class="flex items-center gap-3"><img src="logo.png" onerror="this.src='https://placehold.co/100x100/111/D4AF37?text=SK'" class="w-12 h-12 rounded-full border-2 border-yellow-600 object-cover"><div><h1 class="text-xl font-black text-yellow-500">جزارة سيد خلف</h1><p class="text-xs text-yellow-200/60">الإسماعيلية - 01015861991</p></div></div><button onclick="toggleCartModal()" class="bg-yellow-600 text-black px-5 py-2.5 rounded-xl font-black">السلة (<span id="cart-count-badge">0</span>)</button></div></header>

<main class="max-w-7xl mx-auto px-4 py-8">
<div class="text-center mb-6"><h2 class="text-3xl font-black">أجود اللحوم البلدي - <span class="text-yellow-500">صور حقيقية نية</span></h2><p class="text-gray-400 text-sm mt-2">الإسماعيلية - شارع البحري - توصيل مجاني</p></div>
<div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</main>

<div id="cart-modal" class="fixed inset-0 z-50 hidden"><div class="fixed inset-0 bg-black/80" onclick="toggleCartModal()"></div><div class="fixed left-0 top-0 h-full w-full max-w-md bg-zinc-900 border-r border-yellow-600/30 flex flex-col z-10"><div class="p-5 bg-black flex justify-between items-center border-b border-yellow-600/20"><h3 class="font-black flex gap-2 items-center"><img src="logo.png" class="w-8 h-8 rounded-full"> سلة الطلبات</h3><button onclick="toggleCartModal()"><i class="fa-solid fa-xmark text-xl"></i></button></div><div id="cart-items-container" class="flex-1 overflow-y-auto p-4 space-y-3"></div><div class="p-4 border-t border-yellow-600/20"><div class="flex justify-between font-black text-xl mb-3"><span>الإجمالي:</span><span id="cart-final-total" class="text-yellow-500">0 ج</span></div><button id="btn-proceed-checkout" onclick="openCheckoutModal()" class="w-full py-3 bg-yellow-600 text-black rounded-xl font-black">طلب واتساب</button></div></div></div>
<div id="checkout-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4"><div class="fixed inset-0 bg-black/85" onclick="closeCheckoutModal()"></div><div class="bg-zinc-900 border border-yellow-600/40 rounded-2xl w-full max-w-lg p-6 relative z-10"><h3 class="font-black text-yellow-500 mb-4">بيانات التوصيل</h3><form onsubmit="sendOrderToWhatsApp(event)" class="space-y-3"><input id="cust-name" required placeholder="الاسم" class="w-full p-3 rounded-xl bg-black border border-zinc-700"><input id="cust-phone" required placeholder="الهاتف" class="w-full p-3 rounded-xl bg-black border border-zinc-700"><textarea id="cust-address" required placeholder="العنوان - الإسماعيلية" class="w-full p-3 rounded-xl bg-black border border-zinc-700"></textarea><button type="submit" class="w-full py-3 bg-yellow-600 text-black rounded-xl font-black">إرسال 01015861991</button></form></div></div>

<script>
const productsData = [
  // صور لحمة حقيقية مضمونة
  { id: 1, name: "بوفتيك بلدي", price: 440, unit: "كجم", image: "https://images.unsplash.com/photo-1546964052-d9334ceb32ee?q=80&w=600", desc: "شرائح بوفتيك حمرا نية" },
  { id: 2, name: "ستيك بلدي", price: 450, unit: "كجم", image: "https://images.unsplash.com/photo-1558030006-450066393d65?q=80&w=600", desc: "ستيك انتركوت ني" },
  { id: 3, name: "موزة بلدي", price: 420, unit: "كجم", image: "https://images.unsplash.com/photo-1529692236671-f1f6cf9683ba?q=80&w=600", desc: "موزة طرية نية" },
  { id: 4, name: "عرق فلتو", price: 440, unit: "كجم", image: "https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?q=80&w=600", desc: "فلتو أحمر صافي" },
  { id: 5, name: "لحم أحمر صافي", price: 420, unit: "كجم", image: "https://images.unsplash.com/photo-1587593810167-a84920ea0781?q=80&w=600", desc: "لحمة حمرا بدون دهن نية" },
  { id: 6, name: "لحم ملبس", price: 380, unit: "كجم", image: "https://images.unsplash.com/photo-1608039824140-e0bbf8a7668a?q=80&w=600", desc: "لحمة ملبسة نية" },
  { id: 7, name: "عكاوي", price: 350, unit: "كجم", image: "https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=600", desc: "عكاوي نية للطاجن" },
  { id: 8, name: "كبدة صافي نية", price: 420, unit: "كجم", image: "https://images.unsplash.com/photo-1484980972926-edee96e0960d?q=80&w=600", desc: "كبدة بلدي شرايح نية حمرا" },
  { id: 9, name: "كبدة ضاني نية", price: 450, unit: "كجم", image: "https://images.unsplash.com/photo-1484980972926-edee96e0960d?q=80&w=600", desc: "كبدة ضاني بلدي نية" },
  { id: 10, name: "سجق بلدي ني", price: 320, unit: "كجم", image: "https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?q=80&w=600", desc: "سجق بلدي ني لفائف - صورة حقيقية" },
  { id: 11, name: "مفروم بلدي سايب", price: 320, unit: "كجم", image: "https://images.unsplash.com/photo-1615937657715-bc7b4b7962c1?q=80&w=600", desc: "مفروم لحم ني سايب - صورة حقيقية" },
  { id: 12, name: "برجر بلدي بدون عيش", price: 320, unit: "كجم", image: "https://images.unsplash.com/photo-1528605248644-14dd04022da1?q=80&w=600", desc: "قرص برجر لحم صافي ني بدون عيش - صورة حقيقية" },
];

let cart=[];
window.onload=()=>{renderProducts();}
function renderProducts(){
  document.getElementById("products-grid").innerHTML = productsData.map(item=>{
    const inC=cart.find(c=>c.id===item.id); const q=inC?inC.qty:0;
    return `<div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden hover:border-yellow-600/50 transition"><div class="h-56 bg-black"><img src="${item.image}" loading="lazy" class="w-full h-full object-cover"></div><div class="p-4"><h3 class="font-black text-lg">${item.name}</h3><p class="text-xs text-gray-400 mt-1">${item.desc}</p><div class="flex justify-between items-center mt-3"><span class="text-yellow-500 font-black text-xl">${item.price} ج / ${item.unit}</span></div>${q===0?`<button onclick="addToCart(${item.id})" class="w-full mt-3 py-2.5 bg-zinc-800 border border-yellow-600/30 text-yellow-500 font-bold rounded-xl">إضافة للسلة</button>`:`<div class="flex justify-between items-center mt-3 bg-black border border-yellow-600/40 rounded-xl p-1"><button onclick="updateQty(${item.id},${q+0.5})" class="w-10 h-10 bg-yellow-600 text-black rounded-lg font-black">+</button><span class="font-black">${q} ${item.unit}</span><button onclick="updateQty(${item.id},${q-0.5})" class="w-10 h-10 bg-zinc-800 rounded-lg">-</button></div>`}</div></div>`;
  }).join('');
}
function addToCart(id){ const p=productsData.find(x=>x.id===id); cart.push({...p,qty:1}); updateCart(); renderProducts(); }
function updateQty(id,n){ if(n<=0)cart=cart.filter(c=>c.id!==id); else cart.find(c=>c.id===id).qty=n; updateCart(); renderProducts(); }
function updateCart(){
  document.getElementById("cart-count-badge").innerText=cart.length;
  const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
  document.getElementById("cart-final-total").innerText=total+" ج.م";
  document.getElementById("cart-items-container").innerHTML=cart.map(i=>`<div class="flex justify-between items-center p-3 bg-black rounded-xl border border-zinc-800"><div class="flex gap-3 items-center"><img src="${i.image}" class="w-12 h-12 rounded-lg object-cover"><div><div class="font-bold text-sm">${i.name}</div><div class="text-xs text-yellow-500">${i.price*i.qty} ج</div></div></div><div class="flex gap-2"><button onclick="updateQty(${i.id},${i.qty-0.5})" class="w-7 h-7 bg-zinc-800 rounded">-</button><span class="text-xs w-10 text-center font-bold">${i.qty}</span><button onclick="updateQty(${i.id},${i.qty+0.5})" class="w-7 h-7 bg-yellow-600 text-black rounded">+</button></div></div>`).join('');
}
function toggleCartModal(){ document.getElementById("cart-modal").classList.toggle("hidden"); }
function openCheckoutModal(){ if(!cart.length)return; toggleCartModal(); document.getElementById("checkout-modal").classList.remove("hidden"); }
function closeCheckoutModal(){ document.getElementById("checkout-modal").classList.add("hidden"); }
function sendOrderToWhatsApp(e){
  e.preventDefault();
  const n=document.getElementById("cust-name").value, p=document.getElementById("cust-phone").value, a=document.getElementById("cust-address").value;
  let tot=0, msg=`*طلب جديد - سيد خلف - الإسماعيلية*%0A👤 ${n}%0A📞 ${p}%0A📍 ${a}%0A%0A`;
  cart.forEach(it=>{ tot+=it.price*it.qty; msg+=`• ${it.name} ${it.qty}ك = ${it.price*it.qty}ج%0A`; });
  msg+=`%0Aالإجمالي ${tot} ج`;
  window.open(`https://wa.me/201015861991?text=${msg}`,'_blank');
}
</script>
</body>
</html>
